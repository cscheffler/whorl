<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shoot.py self-test</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  canvas{display:block;touch-action:none}
</style>
<canvas id="c"></canvas>
<script>
// Minimal stand-in for the real toy: N-fold symmetric, additive glow,
// pointer-driven. Exists only to prove the screenshot harness can drive
// input and "see" canvas output. Will be deleted once index.html lands.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let W, H;
function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener('resize', resize);

const N = 6;
let prev = null;
ctx.globalCompositeOperation = 'lighter';
ctx.lineCap = 'round'; ctx.lineJoin = 'round';

function drawSeg(p0, p1){
  const cx = W/2, cy = H/2;
  const a0 = {x:p0.x-cx, y:p0.y-cy}, a1 = {x:p1.x-cx, y:p1.y-cy};
  const hue = (Date.now()/10 + 200) % 360;
  ctx.strokeStyle = `hsla(${hue},90%,60%,0.9)`;
  ctx.lineWidth = 3;
  for(let i=0;i<N;i++){
    const ang = i*2*Math.PI/N;
    const c = Math.cos(ang), s = Math.sin(ang);
    for(const m of [1,-1]){ // mirror
      ctx.beginPath();
      ctx.moveTo(cx + (a0.x*c - m*a0.y*s), cy + (a0.x*s + m*a0.y*c));
      ctx.lineTo(cx + (a1.x*c - m*a1.y*s), cy + (a1.x*s + m*a1.y*c));
      ctx.stroke();
    }
  }
}
cv.addEventListener('pointerdown', e=>{ prev = {x:e.clientX,y:e.clientY}; });
cv.addEventListener('pointermove', e=>{
  if(!prev) return;
  const p = {x:e.clientX,y:e.clientY};
  drawSeg(prev, p); prev = p;
});
addEventListener('pointerup', ()=> prev=null);
console.log('selftest ready, dpr=' + dpr);
</script>
